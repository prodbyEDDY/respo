<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A page that forbids data: images. Whether an injected stylesheet's
         background gets past this is a fact the overlay feature depends on. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>overlay csp</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
      }
    </style>
  </head>
  <body></body>
</html>

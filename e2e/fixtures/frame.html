<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>frame</title>
    <style>
      /*
       * A thick dark border hugging the viewport, and nothing else. The e2e
       * suite captures the view's surface and looks at its outermost pixels:
       * they are dark only if the whole viewport is painted inside the widget —
       * which is the question a zoomed-out canvas asks of a mobile-emulated
       * page (`zoom.spec.ts`).
       */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
      }
      #frame {
        position: fixed;
        inset: 0;
        border: 12px solid #202020;
        box-sizing: border-box;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="frame"></div>
  </body>
</html>

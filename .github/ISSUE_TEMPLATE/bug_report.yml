name: Bug report
description: Report something that isn't working right in Respo
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can reproduce it reliably.
      placeholder: |
        1. Open Respo
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: What you expected to happen, and what actually happened instead.
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: URL or page type
      description: The URL you were previewing, if you can share it. A `file://` page is fine — just describe what kind of page it is instead of the path, if the path is private.
    validations:
      required: false

  - type: input
    id: respo-version
    attributes:
      label: Respo version
      description: Menu (⋯) → About Respo
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
    validations:
      required: true

  - type: input
    id: devices
    attributes:
      label: Devices/suite involved
      description: Which device(s) or device suite were active when this happened.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: "⋯ → About Respo → Open logs folder → attach `main.log`. Remove anything private first."
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
        - label: I'm on the latest release
          required: true

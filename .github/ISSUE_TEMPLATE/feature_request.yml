name: Feature request
description: Suggest an idea or improvement for Respo
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you running into? What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Respo to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've tried.
    validations:
      required: false

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: Does another tool (e.g. Responsively App, browser DevTools, another responsive-design tool) already do this? How?
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the roadmap
          required: true

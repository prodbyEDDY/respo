name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — typecheck, lint, unit, e2e, pack
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The unpackaged app never checks GitHub on its own (`resolveUpdaterMode`),
      # and the updater spec brings its own loopback feed — so no RESPO_NO_UPDATER
      # here: it would switch that spec's feed off too.
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: End-to-end tests (Playwright drives the built app)
        # Temporary diagnostic run; restore the full suite before merging.
        run: npm run e2e -- e2e/ui-polish.spec.ts

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Pack (unpacked directory, no installer)
        run: npm run build:unpack
